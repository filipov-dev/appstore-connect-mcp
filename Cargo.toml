[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://sourcecraft.dev/filipov-dev/appstore-connect-mcp"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Генерация ключа RSA 2048 (certificate_create) без оптимизаций идёт секунды: в отладочной
# сборке и тестах длинная арифметика собирается с оптимизациями.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
