replacement = "appEncryptionDeclarations_getCollection"
filter = "filter[app]"

[[exclude.duplicates]]
operation = "apps_betaAppLocalizations_getToManyRelated"
replacement = "betaAppLocalizations_getCollection"
filter = "filter[app]"

[[exclude.duplicates]]
operation = "betaGroups_builds_getToManyRelated"
replacement = "builds_getCollection"
filter = "filter[betaGroups]"

[[exclude.duplicates]]
operation = "betaGroups_betaTesters_getToManyRelated"
replacement = "betaTesters_getCollection"
filter = "filter[betaGroups]"

[[exclude.duplicates]]
operation = "builds_betaBuildLocalizations_getToManyRelated"
