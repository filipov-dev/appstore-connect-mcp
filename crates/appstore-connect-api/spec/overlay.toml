# Файл-дополнение к спецификации App Store Connect API (spec/openapi.oas.json).
#
# Здесь всё, чего нет в спецификации Apple: наборы инструментов, исключения из уровня
# доступа, сокращения и явные имена инструментов, исключённые операции. Операции
# называются по operationId спецификации. Ссылка на operationId, которого нет в
# спецификации, тег спецификации без набора, повтор имени и имя длиннее 40 символов —
# ошибка сборки (build.rs).
#
# Тексты description и reason — для агента, на английском.

# ---------------------------------------------------------------------------
