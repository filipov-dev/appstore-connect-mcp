# ---------------------------------------------------------------------------
# Уровни доступа. По умолчанию: GET — read, POST/PATCH — write, DELETE — destructive,
# DELETE …/relationships/… (удаление связи) — write (build/access.rs). Ниже — исключения;
# они важнее обоих правил. Уровень destructive получают действия с последствиями для
# пользователей App Store, людей вне команды или необратимые. Исключение, совпадающее
# с уровнем по умолчанию, — ошибка сборки.
# ---------------------------------------------------------------------------

# Отправка на ревью (App Review, ревью TestFlight) и её отмена.
[[access]]
level = "destructive"
reason = "submits content to App Review (or changes a submission)."
operations = [
    "reviewSubmissions_createInstance",
    "reviewSubmissions_updateInstance",
    "reviewSubmissionItems_createInstance",
    "reviewSubmissionItems_updateInstance",
    "betaAppReviewSubmissions_createInstance",
    "inAppPurchaseSubmissions_createInstance",
    "subscriptionSubmissions_createInstance",
    "subscriptionGroupSubmissions_createInstance",
]

# Выпуск версии в App Store, поэтапный релиз, перенос варианта эксперимента
# на страницу продукта: изменения сразу видят покупатели.
[[access]]
level = "destructive"
reason = "releases changes to App Store customers."
operations = [
    "appStoreVersionReleaseRequests_createInstance",
    "appStoreVersionPhasedReleases_createInstance",
    "appStoreVersionPhasedReleases_updateInstance",
    "appStoreVersionPromotions_createInstance",
]

# Цены приложения, встроенных покупок и подписок. Удаление связи prices у подписки
# отменяет запланированные изменения цены, поэтому оно тоже destructive.
[[access]]
level = "destructive"
reason = "changes prices for App Store customers."
operations = [
    "appPriceSchedules_createInstance",
    "inAppPurchasePriceSchedules_createInstance",
    "subscriptionPrices_createInstance",
    "subscriptions_prices_deleteToManyRelationship",
]

# Доступность по странам и предзаказы.
[[access]]
level = "destructive"
reason = "changes availability in App Store territories or pre-orders."
operations = [
    "appAvailabilitiesV2_createInstance",
    "territoryAvailabilities_updateInstance",
    "endAppAvailabilityPreOrders_createInstance",
    "inAppPurchaseAvailabilities_createInstance",
    "subscriptionAvailabilities_createInstance",
    "subscriptionPlanAvailabilities_createInstance",
    "subscriptionPlanAvailabilities_updateInstance",
    "subscriptionPlanAvailabilities_availableTerritories_replaceToManyRelationship",
]

# Сертификаты: удаление (отзыв) — DELETE и так destructive; деактивация сертификата
# (activated: false) ломает Apple Pay и Wallet у пользователей так же.
[[access]]
level = "destructive"
reason = "activates or deactivates a certificate."
operations = ["certificates_updateInstance"]

# Пользователи команды и их роли, доступ к приложениям, приглашения.
[[access]]
level = "destructive"
reason = "changes team members, their roles or app access."
operations = [
    "users_updateInstance",
    "userInvitations_createInstance",
    "users_visibleApps_createToManyRelationship",
    "users_visibleApps_replaceToManyRelationship",
    "users_visibleApps_deleteToManyRelationship",
]

# Тестировщики TestFlight: создание тестировщика и добавление в группу или к сборке
# рассылают приглашения людям вне команды. Внешняя группа или внутренняя, по операции
# не понять, поэтому destructive все добавления тестировщиков. Удаление тестировщика
# из группы — удаление связи, write.
[[access]]
level = "destructive"
reason = "invites testers or notifies them by email."
operations = [
    "betaTesterInvitations_createInstance",
    "betaTesters_createInstance",
    "betaGroups_betaTesters_createToManyRelationship",
    "betaTesters_betaGroups_createToManyRelationship",
    "betaTesters_builds_createToManyRelationship",
    "builds_individualTesters_createToManyRelationship",
    "buildBetaNotifications_createInstance",
]

# Публичные ответы на отзывы покупателей.
[[access]]
level = "destructive"
reason = "publishes a public response to a customer review."
operations = ["customerReviewResponses_createInstance"]

# Необратимые изменения: истечение сборки (expired: true) не отменяется; удаление
# связи introductoryOffers удаляет сами вводные предложения.
[[access]]
level = "destructive"
reason = "cannot be undone (expiring a build, deleting introductory offers)."
operations = [
    "builds_updateInstance",
    "subscriptions_introductoryOffers_deleteToManyRelationship",
]

# Game Center: результаты и достижения игроков, блокировка игроков и модерация
# результатов меняют данные, которые видят игроки.
[[access]]
level = "destructive"
reason = "changes data visible to Game Center players."
operations = [
    "gameCenterLeaderboardEntrySubmissions_createInstance",
    "gameCenterPlayerAchievementSubmissions_createInstance",
    "gameCenterScoreModerations_updateInstance",
    "gameCenterDetailPlayers_updateInstance",
]

# POST, который только проверяет набор правил матчмейкинга на тестовых запросах
# и ничего не сохраняет.
[[access]]
level = "read"
reason = "runs a test of a matchmaking rule set and changes nothing."
operations = ["gameCenterMatchmakingRuleSetTests_createInstance"]

# ---------------------------------------------------------------------------
# Имена инструментов. Базовое имя — из operationId (build/naming.rs): глагол
# (list, get, create, update, delete; для связей list, get, add, remove, replace, set)
# + ресурс в единственном числе + связь, без слов связи, повторяющих ресурс.
# ---------------------------------------------------------------------------

[naming]
# Сокращения применяются по порядку, только пока имя длиннее 40 символов,
# и только по границам слов: короткие имена остаются полными (get_game_center_detail),
# длинные сокращаются (list_gc_leaderboard_set_versions). Порядок важен: сначала
# общепринятые сокращения (gc, iap, loc, eula), потом укорачивание длинных ресурсов.
abbreviations = [
    ["game_center", "gc"],
    ["in_app_purchase", "iap"],
    ["in_app_purchases", "iaps"],
    ["end_user_license_agreement", "eula"],
    ["app_store_version_experiment", "experiment"],
    ["app_store_version_experiments", "experiments"],
    ["app_custom_product_page", "product_page"],
    ["alternative_distribution_package", "alt_package"],
    ["alternative_distribution", "alt_distribution"],
    ["android_to_ios_app_mapping", "android_app_mapping"],
    ["available_territories", "territories"],
    ["compatibility_versions", "compat_versions"],
    ["feedback_screenshot_submission", "feedback_screenshot"],
    ["feedback_screenshot_submissions", "feedback_screenshots"],
    ["localization", "loc"],
    ["localizations", "locs"],
    ["app_store_review", "review"],
    ["one_time_use_code", "one_time_code"],
    ["one_time_use_codes", "one_time_codes"],
    ["app_clip_default_experience", "clip_experience"],
    ["app_clip_advanced_experience", "clip_advanced_experience"],
    ["app_clip", "clip"],
    ["experiment_treatment", "treatment"],
    ["background_asset", "bg_asset"],
    ["encryption_declaration", "encryption"],
    ["app_store_version", "version"],
    ["subscription", "sub"],
]

# Явные имена: operationId = "имя_инструмента". Нужны, когда базовое имя совпадает
# с другим или правила сокращения дают нечитаемое имя.
[naming.overrides]
# Связанный ресурс «один к одному» называется так же, как сам ресурс
# (apps/{id}/appPriceSchedule и appPriceSchedules/{id}): у связанного — суффикс
# _for_<родитель>, потому что id в нём — идентификатор родителя.
"appEncryptionDeclarations_appEncryptionDeclarationDocument_getToOneRelated" = "get_encryption_document_for_declaration"
"apps_appAvailabilityV2_getToOneRelated" = "get_app_availability_for_app"
"apps_appPriceSchedule_getToOneRelated" = "get_app_price_schedule_for_app"
"apps_assetLibrary_getToOneRelated" = "get_asset_library_for_app"
"builds_buildBetaDetail_getToOneRelated" = "get_build_beta_detail_for_build"
"customerReviews_response_getToOneRelated" = "get_response_for_customer_review"
"inAppPurchasesV2_appStoreReviewScreenshot_getToOneRelated" = "get_review_screenshot_for_iap"
"inAppPurchasesV2_content_getToOneRelated" = "get_content_for_iap"
"inAppPurchasesV2_inAppPurchaseAvailability_getToOneRelated" = "get_availability_for_iap"
"inAppPurchasesV2_iapPriceSchedule_getToOneRelated" = "get_price_schedule_for_iap"
"subscriptions_appStoreReviewScreenshot_getToOneRelated" = "get_review_screenshot_for_subscription"
# Эксперименты приложения и эксперименты версии дают одно базовое имя.
"apps_appStoreVersionExperimentsV2_getToManyRelated" = "list_app_experiments"
# Метрики матчмейкинга Game Center: слово matchmaking повторяется в ресурсе и метрике.
"gameCenterDetails_classicMatchmakingRequests_getMetrics" = "get_gc_classic_matchmaking_requests"
"gameCenterDetails_ruleBasedMatchmakingRequests_getMetrics" = "get_gc_rule_based_matchmaking_requests"
"gameCenterMatchmakingQueues_matchmakingQueueSizes_getMetrics" = "get_gc_queue_sizes"
"gameCenterMatchmakingQueues_matchmakingRequests_getMetrics" = "get_gc_queue_requests"
"gameCenterMatchmakingQueues_matchmakingSessions_getMetrics" = "get_gc_queue_sessions"
"gameCenterMatchmakingQueues_experimentMatchmakingQueueSizes_getMetrics" = "get_gc_queue_experiment_sizes"
"gameCenterMatchmakingQueues_experimentMatchmakingRequests_getMetrics" = "get_gc_queue_experiment_requests"
"gameCenterMatchmakingRules_matchmakingBooleanRuleResults_getMetrics" = "get_gc_rule_boolean_results"
"gameCenterMatchmakingRules_matchmakingNumberRuleResults_getMetrics" = "get_gc_rule_number_results"
"gameCenterMatchmakingRules_matchmakingRuleErrors_getMetrics" = "get_gc_rule_errors"
"gameCenterMatchmakingRuleSets_matchmakingQueues_getToManyRelated" = "list_gc_matchmaking_rule_set_queues"
# Длинные имена, которые правила сокращения не укладывают в 40 символов.
"betaGroups_betaRecruitmentCriterionCompatibleBuildCheck_getToOneRelated" = "get_beta_group_compatible_build_check"
"gameCenterDetails_challengesMinimumPlatformVersions_replaceToManyRelationship" = "replace_gc_detail_challenge_min_versions"
"sandboxTestersClearPurchaseHistoryRequestV2_createInstance" = "clear_sandbox_tester_purchase_history"
"appAssetLibraryPlacementOrderingRequests_createInstance" = "create_asset_placement_ordering_request"
"appAvailabilitiesV2_territoryAvailabilities_getToManyRelated" = "list_app_availability_territories"
"betaFeedbackCrashSubmissions_crashLog_getToOneRelated" = "get_beta_feedback_crash_log"
"subscriptionPricePoints_adjustedEqualizations_getToManyRelated" = "list_sub_price_point_adj_equalizations"
"backgroundAssetVersionExternalBetaReleases_getInstance" = "get_bg_asset_external_beta_release"
"backgroundAssetVersionInternalBetaReleases_getInstance" = "get_bg_asset_internal_beta_release"
"buildBundles_appClipDomainCacheStatus_getToOneRelated" = "get_build_bundle_domain_cache_status"
"buildBundles_appClipDomainDebugStatus_getToOneRelated" = "get_build_bundle_domain_debug_status"
"subscriptionPlanAvailabilities_availableTerritories_replaceToManyRelationship" = "replace_sub_plan_territories"

# ---------------------------------------------------------------------------
# Исключённые операции. Они не регистрируются как инструменты, но остаются в таблице
# EXCLUDED (api_search объясняет причину, api_request может их вызвать):
# - устаревшие (deprecated: true в спецификации);
# - чтения связей GET …/relationships/…: возвращают только type и id, а список связанных
#   ресурсов с атрибутами (GET …/{id}/<связь>) есть отдельным инструментом;
# - списки связанных ресурсов, повторяющие общий список с фильтром (ниже).
# Запись связей (add_, remove_, replace_, set_) остаётся.
# ---------------------------------------------------------------------------

[exclude]
keep_deprecated = []
keep_relationship_reads = []

[[exclude.duplicates]]
operation = "apps_builds_getToManyRelated"
replacement = "builds_getCollection"
filter = "filter[app]"

[[exclude.duplicates]]
operation = "apps_betaGroups_getToManyRelated"
replacement = "betaGroups_getCollection"
filter = "filter[app]"

