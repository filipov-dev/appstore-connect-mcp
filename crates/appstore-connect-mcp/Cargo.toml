[package]
name = "appstore-connect-mcp"
description = "MCP server and CLI for the App Store Connect API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
appstore-connect-api = { version = "0.2.0", path = "../appstore-connect-api" }
appstore-connect-mcp-core = { version = "0.2.0", path = "../appstore-connect-mcp-core" }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "signal", "io-util", "io-std", "time"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2.5.8"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", default-features = false, features = ["signal"] }

[dev-dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "std"] }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true
